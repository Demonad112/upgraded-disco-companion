# PE-1: deploy services/pob-engine to a free Hugging Face Docker Space (CPU basic: 2 vCPU, 16 GB, no card).
# Inert until the owner sets the repository secret HF_TOKEN (a write token) and the variable HF_SPACE
# (`<user>/<space>`); docs/remaining/OWNER-STEPS.md has the steps. Pushes only the files the image needs, plus a
# README whose front matter tells Hugging Face to build the Dockerfile and route to port 8080.
name: pob-engine space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - vendor/pob2/**
      - tools/pob2/**
      - services/pob-engine/**

permissions:
  contents: read

concurrency:
  group: pob-engine-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Skip until the owner configures the Space
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "HF_TOKEN or HF_SPACE is not set; nothing to deploy (PE-1, OWNER-STEPS.md)."
      - uses: actions/checkout@v5
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
      - name: Assemble the Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/space"
          mkdir -p "$out/services"
          cp -r vendor tools "$out/"
          rm -rf "$out/tools/pob2/spec"
          rsync -a --exclude test services/pob-engine "$out/services/"
          cp services/pob-engine/Dockerfile "$out/Dockerfile"
          {
            echo '---'
            echo 'title: pob-engine'
            echo 'sdk: docker'
            echo 'app_port: 8080'
            echo 'pinned: false'
            echo '---'
            echo
            echo "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA} by .github/workflows/pob-engine-space.yml. Do not edit here."
            echo
            cat services/pob-engine/README.md
          } > "$out/README.md"
          ls -la "$out"
      - name: Push to the Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        working-directory: ${{ runner.temp }}/space
        run: |
          set -euo pipefail
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -q --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
