name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  # No paths-ignore here: guard, test and secrets are required checks, so they must run on every PR.
  pull_request:
    # ready_for_review: marking a draft ready runs the full suite once.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # One scope decision for both jobs below. A PR that changes only Markdown, docs/ or LICENSE skips their build and
    # tests; the jobs still run and pass, so the required checks are reported. fetch-depth 2: HEAD is the PR merge
    # commit, HEAD^1 its base.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      # Draft PRs run typecheck, lint and unit tests only; e2e and Lighthouse wait until the PR is marked ready.
      heavy: ${{ steps.scope.outputs.code == 'true' && github.event.pull_request.draft != true }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! git diff --name-only HEAD^1 HEAD | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs-only change: build and tests skipped."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - name: Audit runtime deps
        if: needs.changes.outputs.code == 'true'
        # Runtime dependencies only; dev tooling advisories don't ship.
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run typecheck
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: npm run lint
      - name: Test core (with coverage floor), mcp and web
        if: needs.changes.outputs.code == 'true'
        # Core runs once, under coverage: the 90% statements / 75% branches floors in packages/core/vitest.config.ts
        # fail the step. Same suites as `npm test`, without running core twice.
        run: |
          npm run test:coverage --workspace @poe2/core
          npm run test --workspace @poe2/mcp
          npm run test --workspace @poe2/web
      - name: Test ninja-proxy
        if: needs.changes.outputs.code == 'true'
        # Not an npm workspace (it deploys separately), so the root test run
        # never reached it. Its tests pin the live ladder decoder and the
        # league snapshot lookup.
        run: npm test
        working-directory: services/ninja-proxy
      - name: Cache Next.js build cache
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/*.ts', 'apps/web/*.mjs', 'packages/core/src/**', 'packages/data/generated/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-
      - name: Build web
        if: needs.changes.outputs.code == 'true'
        run: npm run build --workspace @poe2/web
      - name: Cache Playwright browsers
        if: needs.changes.outputs.heavy == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for the smoke tests
        if: needs.changes.outputs.heavy == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Smoke-test the built site
        if: needs.changes.outputs.heavy == 'true'
        # Serves apps/web/out under the same base path this CI build used and drives
        # it offline with the captured fixture character. No traces on CI; to debug a failure, re-run that test
        # locally with `--trace on`.
        run: npm run e2e --workspace @poe2/web -- --trace off
      - name: Upload the smoke-test report
        if: failure() && needs.changes.outputs.heavy == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Upload new visual baselines
        if: always() && needs.changes.outputs.heavy == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: visual-baselines
          path: apps/web/e2e/visual.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Build MCP server
        if: needs.changes.outputs.code == 'true'
        run: npm run build --workspace @poe2/mcp
      - name: Verify MCP server over stdio
        if: needs.changes.outputs.code == 'true'
        # Spawns the real binary and drives it with actual protocol messages,
        # asserting the values returned are the real character's.
        run: node scripts/verify-mcp.mjs
      - name: Check the generated tool table is up to date
        if: needs.changes.outputs.code == 'true'
        run: |
          npm run tools --workspace @poe2/mcp
          git diff --exit-code apps/mcp/TOOLS.md \
            || (echo "TOOLS.md is stale — run 'npm run tools -w @poe2/mcp' and commit the result." && exit 1)

  lighthouse:
    needs: changes
    # PRs only: the merge commit was already measured on the PR. 2 runs per route on the PR (median).
    if: github.event_name == 'pull_request'
    # Mobile Lighthouse on the built static site. Fails the job when LCP > 2.5 s or CLS > 0.1 (R49: flipped from warn
    # after five clean main runs, 2026-11-06). If it flakes, set `continue-on-error: true` and the assertions back to "warn".
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.heavy == 'true'
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.heavy == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.heavy == 'true'
      - name: Build web
        if: needs.changes.outputs.heavy == 'true'
        # No GITHUB_ACTIONS basePath: the static server below serves the export from its root.
        env:
          GITHUB_ACTIONS: ''
        run: npm run build
      - name: Lighthouse (mobile, all 8 routes, 2 runs)
        if: needs.changes.outputs.heavy == 'true'
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json --collect.numberOfRuns=2
