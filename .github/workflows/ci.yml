name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  # No paths-ignore here: guard, test and secrets are required checks, so they must run on every PR.
  pull_request:
    # ready_for_review: marking a draft ready runs the full suite once.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # One scope decision for both jobs below. A PR that changes only Markdown, docs/ or LICENSE skips their build and
    # tests; the jobs still run and pass, so the required checks are reported. fetch-depth 2: HEAD is the PR merge
    # commit, HEAD^1 its base.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      # PoB2 headless inputs changed: the pob2-oracle job runs.
      pob2: ${{ steps.scope.outputs.pob2 }}
      # The engine service or what its image copies changed: the pob-engine job runs.
      engine: ${{ steps.scope.outputs.engine }}
      # Draft PRs run typecheck, lint and unit tests only; e2e and Lighthouse wait until the PR is marked ready.
      heavy: ${{ steps.scope.outputs.code == 'true' && github.event.pull_request.draft != true }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! git diff --name-only HEAD^1 HEAD | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs-only change: build and tests skipped."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^((vendor/pob2|tools/pob2|packages/core/test/reference|scripts/pob2|packages/data/generated|packages/data/scripts)/|\.github/workflows/ci\.yml$)'; then
            echo "pob2=true" >> "$GITHUB_OUTPUT"
          else
            echo "pob2=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(vendor/pob2|tools/pob2|services/pob-engine)/'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
          fi
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - name: Audit runtime deps
        if: needs.changes.outputs.code == 'true'
        # Runtime dependencies only; dev tooling advisories don't ship.
        run: npm audit --omit=dev --audit-level=high
      - name: Verify vendored PoB2
        if: needs.changes.outputs.code == 'true'
        # vendor/pob2 must be byte-identical to vendor/pob2/PIN.json (written only by npm run pob2:sync).
        run: npm run pob2:verify
      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run typecheck
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: npm run lint
      - name: Test core (with coverage floor) and web
        if: needs.changes.outputs.code == 'true'
        # Core runs once, under coverage: the 90% statements / 75% branches floors in packages/core/vitest.config.ts
        # fail the step. Same suites as `npm test`, without running core twice.
        run: |
          npm run test:coverage --workspace @poe2/core
          npm run test --workspace @poe2/web
      - name: Test ninja-proxy
        if: needs.changes.outputs.code == 'true'
        # Not an npm workspace (it deploys separately), so the root test run
        # never reached it. Its tests pin the live ladder decoder and the
        # league snapshot lookup.
        run: npm test
        working-directory: services/ninja-proxy
      - name: Cache Next.js build cache
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/*.ts', 'apps/web/*.mjs', 'packages/core/src/**', 'packages/data/generated/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-
      - name: Build web
        if: needs.changes.outputs.code == 'true'
        run: npm run build --workspace @poe2/web
      - name: Cache Playwright browsers
        if: needs.changes.outputs.heavy == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for the smoke tests
        if: needs.changes.outputs.heavy == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Smoke-test the built site
        if: needs.changes.outputs.heavy == 'true'
        # Serves apps/web/out under the same base path this CI build used and drives
        # it offline with the captured fixture character. No traces on CI; to debug a failure, re-run that test
        # locally with `--trace on`.
        run: npm run e2e --workspace @poe2/web -- --trace off
      - name: Scroll guard
        if: needs.changes.outputs.heavy == 'true'
        # WQA3-9b: functional sky checks on the built site; fails the job (B7-1, 2026-11-17). The script pins the Full
        # effects tier, since CI's software renderer would make Auto still.
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}"
          E2E_BASE_PATH="$BASE" node apps/web/e2e/serve.mjs &
          sleep 3
          node scripts/scroll-audit.cjs "http://localhost:4321$BASE/"
      - name: Upload the smoke-test report
        if: failure() && needs.changes.outputs.heavy == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Upload new visual baselines
        if: always() && needs.changes.outputs.heavy == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: visual-baselines
          path: apps/web/e2e/visual.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 14

  pob2-oracle:
    # Real PoB2 headless (vendor/pob2) in PoB's own tests image, pinned by digest in vendor/pob2/PIN.json (testsImage).
    # The runner decodes the codes with @poe2/core (the image has no Node; PoB's headless Inflate is a stub) and every
    # Lua step runs in the image via docker run (scripts/pob2/run.mjs, repo mounted read-only, no network).
    # PB-2a: 15 green runs by 2026-11-27; the owner adds it as a required check (a skipped run counts as passing).
    needs: changes
    if: needs.changes.outputs.pob2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POB2_RUNNER: docker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build core (decodes the PoB codes)
        run: npm run build --workspace @poe2/core
      - name: Pull PoB tests image
        run: docker pull "$(node -p "require('./vendor/pob2/PIN.json').testsImage")"
      - name: Busted specs (tools/pob2/spec)
        run: npm run pob2:spec
      - name: Oracle files match PoB
        # Regenerates packages/core/test/reference/<name>/{oracle,groups.oracle}.json and fails on any byte diff;
        # the diff is printed in the log. Fix: npm run pob2:oracle, review, commit with the cause.
        run: npm run pob2:oracle -- --check
      - name: Generated data matches PoB (PB-4a)
        # Rebuilds mod-tiers, bases, pob-skills, skill-levels and the tree from vendor/pob2 and fails on any byte diff,
        # so generated/ can't drift from the pin. Fix: npm run build:pob -w @poe2/data, commit with the cause.
        run: |
          npm run build:pob --workspace @poe2/data
          git diff --exit-code -- packages/data/generated

  pob-engine:
    # services/pob-engine: its unit tests, then its Docker image built and asked to calculate the reference code, which
    # must give the oracle's TotalDPS. PE-2: 10 green runs by 2026-11-27; the owner adds it as a required check.
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests (the engine test skips without luajit; the image below runs the real engine)
        working-directory: services/pob-engine
        run: npm test
      - name: Build image
        run: docker build -f services/pob-engine/Dockerfile -t pob-engine .
      - name: Image reproduces the oracle
        run: |
          docker run -d --name engine -p 8080:8080 pob-engine
          for i in $(seq 1 60); do curl -fs localhost:8080/health | grep -q pobVersion && break; sleep 2; done
          node -e '
            const fs = require("fs")
            const ref = "packages/core/test/reference/ninja-default/"
            const code = fs.readFileSync(ref + "code.txt", "utf8").trim()
            const want = JSON.parse(fs.readFileSync(ref + "oracle.json", "utf8")).stats.TotalDPS
            fetch("http://localhost:8080/calc", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code }) })
              .then((r) => r.json())
              .then((j) => {
                const got = j.snapshot && j.snapshot.stats && j.snapshot.stats.TotalDPS
                console.log("TotalDPS", got, "oracle", want, "rows", j.groups && j.groups.rows.length, "ms", j.ms)
                process.exit(got === want ? 0 : 1)
              })'
      - if: failure()
        run: docker logs engine || true

  lighthouse:
    needs: changes
    # PRs only: the merge commit was already measured on the PR. 2 runs per route on the PR (median).
    if: github.event_name == 'pull_request'
    # Mobile Lighthouse on the built static site. Fails the job when LCP > 3.6 s or CLS > 0.1 (R49: flipped from warn
    # after five clean main runs, 2026-11-06). If it flakes, set `continue-on-error: true` and the assertions back to "warn".
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.heavy == 'true'
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.heavy == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.heavy == 'true'
      - name: Build web
        if: needs.changes.outputs.heavy == 'true'
        # No basePath: the static server below serves the export from its root. Setting GITHUB_ACTIONS to '' did not
        # work (Actions keeps its GITHUB_* defaults), so every stylesheet 404'd and Lighthouse scored an unstyled page.
        env:
          ROOT_BASE_PATH: '1'
        run: npm run build
      - name: Route weight budgets
        if: needs.changes.outputs.heavy == 'true'
        # ORCH-2: route, lazy and per-chunk budgets from scripts/route-weight.mjs; exits 1 when one is over. Reuses the build above.
        run: node scripts/route-weight.mjs
      - name: Lighthouse (mobile, all 8 routes, 2 runs)
        if: needs.changes.outputs.heavy == 'true'
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json --collect.numberOfRuns=2
      - name: Upload Lighthouse reports
        if: always() && needs.changes.outputs.heavy == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: .lighthouseci
          # A dot-directory: upload-artifact@v4+ skips hidden files unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: List accessibility audits below 1 (report only)
        # The job log names each failing audit, so a session without artifact access can read it.
        if: always() && needs.changes.outputs.heavy == 'true'
        continue-on-error: true
        run: node scripts/lhci-a11y-report.mjs .lighthouseci
