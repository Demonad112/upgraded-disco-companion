name: Deploy pob-engine

# Builds services/pob-engine's image and deploys it to Cloudflare Containers (services/pob-engine/cloudflare), checks
# the live engine on the reference code, then points the Pages site at it (NEXT_PUBLIC_POB_ENGINE_BASE) and starts a
# production Pages build so the site picks it up. Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts
# Edit, Containers Edit, Cloudflare Pages Edit, Account Settings Read) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['services/pob-engine/**', 'tools/pob2/**', 'vendor/pob2/**']

permissions:
  contents: read

concurrency:
  group: pob-engine-deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: upgraded-disco-companion

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets present
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          msg="Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (services/pob-engine/README.md)"
          # A push before the secrets exist skips the deploy; a run by hand says what is missing.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo "::error::$msg"; exit 1; fi
          echo "::notice::Deploy skipped. $msg"; echo "ok=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Install wrangler
        if: steps.secrets.outputs.ok == 'true'
        working-directory: services/pob-engine/cloudflare
        run: npm ci
      - name: Deploy Worker and container
        if: steps.secrets.outputs.ok == 'true'
        id: deploy
        working-directory: services/pob-engine/cloudflare
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://pob-engine\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::no workers.dev URL in the deploy output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Live engine reproduces the oracle
        if: steps.secrets.outputs.ok == 'true'
        env:
          ENGINE: ${{ steps.deploy.outputs.url }}
        run: |
          # The container starts on the first request (image pull, then PoB's ~3 s start); allow a few minutes.
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "$ENGINE/health" | grep -q pobVersion; then break; fi
            sleep 10
          done
          curl -fsS "$ENGINE/health"; echo
          node -e '
            const fs = require("fs")
            const ref = "packages/core/test/reference/ninja-default/"
            const code = fs.readFileSync(ref + "code.txt", "utf8").trim()
            const want = JSON.parse(fs.readFileSync(ref + "oracle.json", "utf8")).stats.TotalDPS
            fetch(process.env.ENGINE + "/calc", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code }) })
              .then((r) => r.json())
              .then((j) => {
                const got = j.snapshot && j.snapshot.stats && j.snapshot.stats.TotalDPS
                console.log("TotalDPS", got, "oracle", want, "rows", j.groups && j.groups.rows.length, "ms", j.ms)
                process.exit(got === want ? 0 : 1)
              })'
      - name: Point the Pages site at the engine and rebuild it
        if: steps.secrets.outputs.ok == 'true'
        env:
          ENGINE: ${{ steps.deploy.outputs.url }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
          current=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | node -e '
            let s = ""; process.stdin.on("data", (c) => (s += c)).on("end", () => {
              const p = JSON.parse(s).result.deployment_configs.production.env_vars || {}
              process.stdout.write((p.NEXT_PUBLIC_POB_ENGINE_BASE || {}).value || "")
            })')
          if [ "$current" = "$ENGINE" ]; then echo "Pages already points at $ENGINE"; exit 0; fi
          body=$(node -e '
            const v = { NEXT_PUBLIC_POB_ENGINE_BASE: { type: "plain_text", value: process.env.ENGINE } }
            process.stdout.write(JSON.stringify({ deployment_configs: { production: { env_vars: v }, preview: { env_vars: v } } }))')
          curl -fsS -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" "$api" --data "$body" > /dev/null
          curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/deployments" > /dev/null
          echo "Pages now builds with NEXT_PUBLIC_POB_ENGINE_BASE=$ENGINE; a production build was started."
