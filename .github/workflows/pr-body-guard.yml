name: PR body guard

# The job is named `guard` because the `main` ruleset requires a check with that name. It no longer scans PR text;
# it self-tests the Claude hooks. Rename or delete it only together with the ruleset.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Self-test the Claude hooks
        run: node --test .claude/hooks/*.test.mjs
