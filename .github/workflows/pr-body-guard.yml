name: PR body guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Self-test the guard
        run: node --test scripts/check-pr-body.test.mjs
      - name: No session info in PR title or body
        # Reads title and body from $GITHUB_EVENT_PATH: no `env:` (the runner prints env values in the log) and no
        # `${{ }}` in the script text (injection).
        run: node scripts/check-pr-body.mjs
